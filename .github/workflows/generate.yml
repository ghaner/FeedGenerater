name: Generate SeedHub RSS

# 主生成器：在 GitHub 仓库内定时抓取 seedog.cc 并重新生成 feed.xml。
# 每 6 小时（UTC）自动跑一次；也可手动触发。
# 若某次被 Cloudflare 拦截（提取不到条目），脚本不会改写 feed.xml，
# 本流程会以「0 条目」判定并跳过提交，保留上一次成功的 feed，订阅不受影响。
on:
  schedule:
    - cron: "0 */6 * * *"   # 每 6 小时（UTC）一次
  workflow_dispatch:        # 支持在 Actions 页面手动触发

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run generator (best-effort; Cloudflare block is expected & safe)
        continue-on-error: true
        run: python src/generate_feed.py

      - name: Validate & commit
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          try:
              t = ET.parse("feed.xml")
              n = len(t.getroot().find("channel").findall("item"))
          except Exception:
              n = 0
          open("itemcount.txt", "w").write(str(n))
          PY

          n=$(cat itemcount.txt)
          if [ "$n" -lt 1 ]; then
            echo "未提取到条目（可能被 Cloudflare 拦截），保留旧 feed.xml，跳过提交。"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash
          git add feed.xml
          if git diff --cached --quiet feed.xml; then
            echo "feed.xml 无变化，跳过提交"
          else
            git commit -m "chore: refresh feed.xml (scheduled)"
            git push
          fi
