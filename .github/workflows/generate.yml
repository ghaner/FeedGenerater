name: Generate RSS Feeds

# 主生成器：在 GitHub 仓库内定时抓取 sources.json 中配置的所有网址，
# 各自生成 <name>.xml（文件名即配置里的 name；seedog -> seedog.xml）。
# 每 6 小时（UTC）自动跑一次；也可手动触发。
# 若某次被反爬拦截（命中挑战页或提取 0 条），脚本不会改写该 feed，
# 本流程保留上一次成功的 feed，订阅不受影响。
on:
  schedule:
    - cron: "0 */6 * * *"   # 每 6 小时（UTC）一次
  workflow_dispatch:        # 支持在 Actions 页面手动触发

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run generator (best-effort; per-source failure is safe)
        continue-on-error: true
        run: python src/generate_feed.py

      - name: Validate & commit changed feeds
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET, glob
          ok = True
          for fn in glob.glob("*.xml"):
              try:
                  n = len(ET.parse(fn).getroot().find("channel").findall("item"))
              except Exception:
                  n = 0
              print(f"{fn}: {n} items")
              if n == 0:
                  ok = False
          open("feeds_ok.txt", "w").write("1" if ok else "0")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash
          git add -A "*.xml"
          if git diff --cached --quiet; then
            echo "XML 无变化，跳过提交"
          else
            git commit -m "chore: refresh feeds (scheduled)"
            git push
          fi
